<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E7A5C"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shipa Pharm">
<style>*{box-sizing:border-box}html,body{margin:0}</style></head><body>
<title>Shipa Pharm бошқаруви</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: mobile-first app shell — sticky header with branch switch, one view at a time, fixed bottom tab bar; widens to a 2-column grid on desktop */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --line:#DCE4E0; --ink:#13241F; --muted:#5E716B;
  --accent:#0E7A5C; --accent-soft:#DDF0E8; --branch2:#B9772A; --branch2-soft:#F6E9D6;
  --good:#1E8A4F; --warn:#B9772A; --bad:#C2413A; --bad-soft:#F8E1DF; --info:#2F6FB0; --info-soft:#E0EBF6;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#16221E; --line:#26362F; --ink:#E4EEEA; --muted:#93A8A0;
  --accent:#3FC497; --accent-soft:#163A2F; --branch2:#E0A35A; --branch2-soft:#3A2B18;
  --good:#4CC583; --warn:#E0A35A; --bad:#EF7A72; --bad-soft:#3D1F1D; --info:#7DB0E6; --info-soft:#1B2C3F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16221E; --line:#26362F; --ink:#E4EEEA; --muted:#93A8A0;
  --accent:#3FC497; --accent-soft:#163A2F; --branch2:#E0A35A; --branch2-soft:#3A2B18;
  --good:#4CC583; --warn:#E0A35A; --bad:#EF7A72; --bad-soft:#3D1F1D; --info:#7DB0E6; --info-soft:#1B2C3F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-inline:16px;padding-block:12px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.01em}
.brand b span{color:var(--accent)}
.brand small{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:1100px;margin:10px auto 0;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:6px 10px;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.add{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}

main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--font-display);font-weight:500;font-size:15px;margin:0;text-wrap:balance}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.notice{background:var(--info-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:20px;font-weight:700;overflow-wrap:break-word}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.main{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.main .lbl,.kpi.main .s{color:var(--bg);opacity:.75}
.kpi.main .v{font-family:var(--font-display);font-size:26px;font-weight:700}
@media (min-width:760px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi.main{grid-column:auto}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.grid2{display:grid;gap:16px}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .t{font-weight:600;overflow-wrap:break-word}
.row .m{font-size:13px;color:var(--muted);overflow-wrap:break-word}
.row .amt{font-weight:700;text-align:right;white-space:nowrap}
.amt.in{color:var(--good)}.amt.out{color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.x{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:6px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.x.ok{color:var(--bad)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.b2{background:var(--branch2-soft);color:var(--branch2)}
.chip.sample{background:var(--info-soft);color:var(--info)}
select.status{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:600;background:var(--surface)}
select.status[data-s="Янги"]{background:var(--info-soft);color:var(--info);border-color:transparent}
select.status[data-s="Тайёрланмоқда"],select.status[data-s="Етказилмоқда"]{background:var(--branch2-soft);color:var(--warn);border-color:transparent}
select.status[data-s="Бажарилди"]{background:var(--accent-soft);color:var(--good);border-color:transparent}
select.status[data-s="Бекор"]{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.empty{color:var(--muted);font-size:13.5px;padding:14px 0;text-align:center}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input,.tools select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sum b{color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs div{display:flex;gap:2px;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600;background:var(--accent-soft)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet .kinds{display:flex;gap:6px;flex-wrap:wrap}
.sheet .kinds button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px}
.sheet .kinds button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end}
.sheet .btns button{border-radius:10px;padding:10px 16px;font-weight:600;border:1px solid var(--line);background:none}
.sheet .btns .add{border:0;background:var(--accent);color:#fff}
.err{color:var(--bad);font-size:13px}

.tbl{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:440px}
.tbl th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover,.tbl tbody tr.sel{background:var(--accent-soft)}
.tbl tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:0;font-size:14px}
.ledger>div{padding:9px 0;border-top:1px solid var(--line)}
.ledger>div:nth-child(-n+2){border-top:0}
.ledger .r{text-align:right;font-weight:700}
.ledger .tot{font-weight:700;font-size:16px;border-top:2px solid var(--ink)}
.ledger .hint{display:block;font-size:12px;color:var(--muted);font-weight:400}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.bar .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--bad);border-radius:3px}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.chip.paid{background:var(--accent-soft);color:var(--good)}
.pay{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.paylist{font-size:12px;color:var(--muted)}
.scan{display:flex;flex-direction:column;gap:10px}
.scan input{font-size:20px;padding:14px 16px;border:2px solid var(--accent);border-radius:12px;background:var(--bg);width:100%;letter-spacing:.04em}
.hit{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.hit.ok{background:var(--accent-soft)}
.hit.no{background:var(--bad-soft)}
.hit .nm{font-size:22px;font-weight:700;overflow-wrap:break-word;text-wrap:balance}
.hit .pr{font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--accent)}
.hit .bc{font-size:13px;color:var(--muted)}
.hit .acts{justify-content:flex-start}
.btn2{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn2.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.row.click{cursor:pointer}
.sel{user-select:all}
.dcard{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.list>.dcard:first-child{border-top:0}
.dcard.late{border-left:4px solid var(--bad);padding-left:12px}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dname{font-weight:700;font-size:17px;overflow-wrap:break-word;min-width:0}
.damt{font-weight:800;font-size:18px;white-space:nowrap}
.ddates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ddates>div{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.dd{font-weight:700;font-size:15px}
.dd.bad{color:var(--bad)}.dd.warn{color:var(--warn)}.dd.muted{color:var(--muted);font-weight:500}
.fcard{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.list>.fcard:first-child{border-top:0}
.ftop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fcard a.wa{align-self:flex-start;margin:0}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sg{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:var(--surface);padding:12px 14px;text-align:left}
.sg:first-child{border-top:0}
.sg:active{background:var(--accent-soft)}
.sgn{font-weight:600;min-width:0;overflow-wrap:break-word}
.sgp{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.sgp b{color:var(--good)}.sgp small{color:var(--muted);font-size:12px}
.sgp.none{color:var(--muted);font-size:12.5px}
.moreseg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.moreseg::-webkit-scrollbar{display:none}
.moreseg button{flex:0 0 auto;padding:7px 14px}
.impbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cam.ib{flex-direction:column;justify-content:center;padding:12px 6px;font-size:13.5px!important;gap:4px!important;min-height:72px}
.cam.ib svg{width:26px;height:26px}
#lockScr{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.lockbox .f{text-align:left}
.lockbox{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px;text-align:center}
.lockbox .brand b{font-family:var(--font-display);font-size:26px}.lockbox .brand span{color:var(--accent)}
.pinin{font-size:28px;letter-spacing:.4em;text-align:center;padding:14px;border:2px solid var(--accent);border-radius:12px;background:var(--surface)}
.kv.kv4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.kv.kv4{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kv small{color:var(--muted);font-size:12px}
.kvb{display:flex;flex-direction:column;gap:3px;background:var(--bg);border:0;border-radius:10px;padding:8px 10px;text-align:left;min-width:0}
.kvb.bad b{color:var(--bad)}
.kvb:active{background:var(--accent-soft)}
.mcard{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.list>.mcard:first-child{border-top:0}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:14.5px}
.dl dt{color:var(--muted);white-space:nowrap}
.dl dd{margin:0;text-align:right;overflow-wrap:break-word;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.dl dd .chip{white-space:normal;max-width:100%;text-align:right}
.expl{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.nw{white-space:nowrap}
.mrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.list>.mrow:first-child{border-top:0}
.mrt{display:flex;justify-content:space-between;gap:10px}
.mrt span{font-weight:700;white-space:nowrap}
.dl dd small{color:var(--muted);font-size:12.5px}
.dl dd .chip{margin-top:2px}
@media (max-width:380px){.dl{grid-template-columns:1fr}.dl dd{text-align:left;align-items:flex-start;padding-bottom:4px;border-bottom:1px dashed var(--line)}.dl dd .chip{text-align:left}.expl{align-items:flex-start}}
.fline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin-top:4px}
.fline small{color:var(--muted)}
.fc{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.fcbig{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted)}
.fcbig b{font-family:var(--font-display);font-size:24px;color:var(--accent);white-space:nowrap}
.fct{width:100%;border-collapse:collapse;font-size:13.5px}
.fct td{padding:5px 4px;border-top:1px solid var(--line);white-space:nowrap}
.fct td:first-child{white-space:normal;font-weight:600}
.fct tr.best td{color:var(--good)}
.warnt{color:var(--warn);font-weight:600}
.pickme{display:flex;flex-direction:column;gap:8px}
.pickme .btn2{display:flex;flex-direction:column;align-items:flex-start;padding:12px 14px;font-size:16px}
.pickme small{color:var(--muted);font-weight:400;font-size:12.5px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:-2px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv>div{display:flex;flex-direction:column;gap:3px;background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.kv b{font-size:14.5px;overflow-wrap:break-word}
.hist{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;border-top:1px solid var(--line);padding-top:6px}
.hrow small{color:var(--muted)}
.row .t{font-size:15.5px}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr);gap:8px}
  .row>.acts{flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;flex-wrap:wrap;gap:8px 12px}
  .row>.acts>.acts{justify-content:flex-start}
  .row .amt{text-align:left;font-size:16px}
  .row .x{padding:6px 10px;border:1px solid var(--line);border-radius:8px}
}
.menubtn{flex:1;display:flex!important;flex-direction:row!important;align-items:center;justify-content:flex-start;gap:10px!important;font-size:16px!important;padding:10px!important;color:var(--ink)!important;background:var(--accent-soft)!important;border-radius:12px!important}
.menubtn .mlbl{font-weight:700;color:var(--accent)}
.menubtn #curSec{font-weight:600}
.menubtn #curSec::before{content:"· ";color:var(--muted)}
.mpop{position:fixed;left:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;width:200px;max-height:62vh;overflow-y:auto}
.mi{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:9px;padding:8px 10px;text-align:left;font-size:15px;font-weight:600;color:var(--ink)}
.mi svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.mi[aria-current="page"]{background:var(--accent-soft)}
.mi:active{background:var(--accent-soft)}
.dacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a.wa{display:inline-flex;align-items:center;gap:8px;margin-block:6px;padding:8px 14px;border-radius:999px;background:#1FA855;color:#fff;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
a.wa svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linejoin:round}
a.wa:active{opacity:.85}

function cashFor(m){
  const s=state.sales.filter(inBranch);
  const before=s.filter(r=>(r.date||"")<m+"-01");
  const opening=sum(before.filter(r=>r.type==="in"))-sum(before.filter(r=>r.type==="out"));
  const ms=s.filter(r=>(r.date||"").startsWith(m));
  const inc=sum(ms.filter(r=>r.type==="in")), out=sum(ms.filter(r=>r.type==="out"));
  const days=[...new Set(ms.map(r=>r.date))].sort();
  let run=opening;
  const rows=days.map(d=>{const di=sum(ms.filter(r=>r.date===d&&r.type==="in")),dout=sum(ms.filter(r=>r.date===d&&r.type==="out"));run+=di-dout;return {d,inc:di,out:dout,net:di-dout,cash:run};});
  const byCat={};ms.filter(r=>r.type==="out").forEach(r=>{byCat[r.category||"Бошқа"]=(byCat[r.category||"Бошқа"]||0)+(+r.amount||0);});
  const incCat={};ms.filter(r=>r.type==="in").forEach(r=>{incCat[r.category||"Бошқа"]=(incCat[r.category||"Бошқа"]||0)+(+r.amount||0);});
  const chk=ms.filter(r=>r.type==="in"&&Array.isArray(r.items));
  const itemRev=chk.reduce((a,r)=>a+r.items.reduce((x,i)=>x+i.qty*i.price,0)-(+r.discount||0),0);
  const itemCost=chk.reduce((a,r)=>a+r.items.reduce((x,i)=>x+i.qty*(+i.cost||0),0),0);
  return {opening,inc,out,net:inc-out,closing:opening+inc-out,rows,byCat,incCat,ms,itemRev,itemCost,checks:chk.length};
}
function supStats(name){

  const last=e.filter(x=>x.type==="buy").map(x=>x.date).sort().pop()||"";
  return {owed:Math.max(0,credit-pays),bought:sum(e.filter(x=>x.type==="buy")),last,entries:e};
}

}

async function completeSale(){
  if(selling)return;
  const err=$("#sellErr");const fail=t=>{err.textContent=t;err.hidden=false;};
  const br=branch==="all"?($("#saleBr")?$("#saleBr").value:saleBranch):branch;
  if(!br)return fail("Филиални танланг");
  const lines=cart.map(c=>({c,m:findMed(c.barcode)})).filter(x=>x.m);
  if(!lines.length)return fail("Ҳали дори қўшилмади");
  const dName=$("#dName")?$("#dName").value.trim():"",dPhone=$("#dPhone")?$("#dPhone").value.trim():"";
  if(payType==="debt"&&!dName)return fail("Ким олганини ёзинг");
  const who=($("#seller")&&$("#seller").value)||(me&&me.name)||"";
  selling=true;
  const items=lines.map(({c,m})=>({barcode:m.barcode,name:m.name,qty:c.qty,price:+m.price||0,cost:+m.cost||0}));
  const gross=items.reduce((a,i)=>a+i.qty*i.price,0), costTotal=items.reduce((a,i)=>a+i.qty*i.cost,0);

    const date=todayISO(),desc=items.map(i=>i.name+(i.qty>1?" ×"+i.qty:"")).join(", ");
    let ok;
    if(payType==="debt"){ok=await addRec("debts",{name:dName,phone:dPhone,items:desc,amount:total,date,due:"",branch:br,payments:[],saleItems:items,seller:who,discount});if(ok)await ensureCustomer(dName,dPhone,br);}
    else{const pe=$("#paidAmt"),paid=pe&&pe.value!==""?Math.round(+pe.value):total;ok=await addRec("sales",{type:"in",amount:paid>=0?paid:total,date,category:PAY_NAMES[payType]||"Нақд",branch:br,note:"Сотув: "+desc+(discount?" (чегирма "+num(discount)+")":"")+(paid!==total?" · ҳисоб "+num(total)+", келган "+num(paid):""),items,costTotal,seller:who,discount});}

}

async function decodePhoto(file){
  toast("Расм ўқилмоқда…");
  let code="";
  try{
    if("BarcodeDetector" in window){try{const bd=new BarcodeDetector();const c=await imgCanvas(file,1600,0);const r=await bd.detect(c);if(r&&r[0])code=r[0].rawValue;}catch(e){}}
    if(!code){
      const Z=await loadZX();
      const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.DATA_MATRIX,Z.BarcodeFormat.QR_CODE]);
      const reader=new Z.MultiFormatReader();reader.setHints(hints);
      outer: for(const size of [1600,1000,2400]){for(const rot of [0,90]){
        const c=await imgCanvas(file,size,rot);
        try{const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)));const r=reader.decode(bmp);if(r){code=r.getText();break outer;}}catch(e){}
      }}
    }
  }catch(e){return toast("Камера ўқувчиси юкланмади. Интернетни текширинг.");}
  code=cleanCode(code);
  if(code.length>14&&/^01\d{14}/.test(code))code=code.slice(3,16);
  if(!code)return toast("Штрих-код топилмади. Кодга яқинроқ, тўғри ва ёруғда расмга олинг.");
  if(camTarget==="f_code"){const e=document.getElementById("f_code");if(e){e.value=code;if(sheetKind==="recv")refreshRecv();const n=sheetKind==="recv"&&findMed(code)?$("#f_qty"):$("#f_name");if(n)n.focus();}toast("Код: "+code);}
  else doScan(code);
}

(async()=>{
  db=await connectDB();
  if(!db){loaded=true;$("#main").insertAdjacentHTML("afterbegin",`<div class="notice">Маълумотлар базасига уланиб бўлмади — киритилган ёзувлар сақланмайди. ${FIREBASE_CONFIG?"Интернетни текширинг.":"Саҳифани claude.ai'да ҳисобингизга кириб очинг."}</div>`);return;}
  const parts={},got=new Set();let total=0,rq=0,full=new Set();
  const later=()=>{if(rq)return;rq=setTimeout(()=>{rq=0;render();},40);};
  const merge=c=>{const m=new Map();for(const k in parts[c])for(const d of parts[c][k])m.set(d.id,d);state[c]=[...m.values()];};
  COLS.forEach(c=>{parts[c]={};const n=FB?1:(SHARDS[c]||1);
    const qs=[["all",FB?db.collection(c):db.collection(c).limit(1000)]];
    if(n>1)for(let k=0;k<n;k++)qs.push(["s"+k,db.collection(c).where("sh","==",k).limit(1000)]);
    total+=qs.length;
    qs.forEach(([key,qr])=>qr.onSnapshot(snap=>{parts[c][key]=snap.docs.map(d=>({id:d.id,...d.data()}));merge(c);
      if(!FB&&key!=="all"&&snap.docs.length>=1000)full.add(c);
      got.add(c+"/"+key);if(!loaded&&got.size===total){loaded=true;setTimeout(backfillShards,3000);}
      if(full.size&&!window._fullWarn&&boss()){window._fullWarn=1;toast("Маълумот жуда кўпайди ("+[...full].join(", ")+"). Дастурни расмий версияга ўтказиш вақти келди.");}
      later();},()=>toast("Маълумот юкланмади")));
  });
})();

})();
